server:
  # 改端口：java -jar app.jar --server.port=9090
  # 注意别用 ${SERVER_PORT:8080} 这类占位符 —— SERVER_PORT / SERVER__PORT 本身就是
  # Spring 的环境变量约定，优先级高于本文件，宿主预设了就会静默覆盖这里（踩过）。
  port: 8080
  tomcat:
    threads:
      max: 200
    # 优雅停机：收到 SIGTERM 后处理完在途请求再退出，避免事务被中断
    graceful-shutdown-period: 20s

spring:
  application:
    name: ticket-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：首次启动自动建库，配合 Flyway 建表
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ticket_system}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      pool-name: TicketHikariPool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 800ms
      connect-timeout: 800ms

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    # 慢 SQL 直接打到日志里，配合 MySQL slow_query_log 双保险
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  auth:
    token-ttl-minutes: ${AUTH_TTL_MINUTES:120}
    # local: 进程内会话（开箱即跑） | redis: 多实例共享
    store: ${AUTH_STORE:local}
  idempotent:
    # local: ConcurrentHashMap（remove 同样是原子操作） | redis: 跨实例共享
    store: ${IDEMPOTENT_STORE:local}
    token-ttl-seconds: 300
  ticket:
    # 已关闭工单允许重开的天数
    reopen-days: 7

logging:
  level:
    root: info
    com.example.ticket: info
  # Windows 默认控制台编码是 GBK，不显式指定会把中文日志输出成 ????
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs
